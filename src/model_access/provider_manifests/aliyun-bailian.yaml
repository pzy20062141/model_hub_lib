protocol_version: "1.1"
provider:
  plugin_id: builtin/aliyun-bailian
  provider_id: aliyun_bailian
display_name:
  default: Alibaba Cloud Model Studio
  zh_Hans: 阿里云百炼
default_base_url: https://llm-3wg685w4xnh5wgow.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
supported_model_types:
  - text_generation
  - embedding
  - rerank
capabilities:
  supports_streaming: true
  supports_tools: true
  supports_vision: true
  supports_json_schema: true
  supports_system_message: true
  supports_token_counting: true
  supports_multimodal: true
dynamic_model_discovery: false
models:
  - model: qwen-plus
    label: Qwen Plus
    model_type: text_generation
    input_modalities: [text]
    output_modalities: [text]
    categories: [TEXT_MODEL]
    operations: [chat, text_completion]
    features: [streaming, tool_calling]
    context_window: 1000000
  - model: qwen3.8-max
    label: Qwen 3.8 Max
    model_type: text_generation
    input_modalities: [text, image]
    output_modalities: [text]
    categories: [TEXT_MODEL, VISION_MODEL]
    operations: [chat]
    features: [streaming, tool_calling, json_schema, reasoning]
    context_window: 1000000
    max_output_tokens: 131072
  - model: qwen3.8-flash
    label: Qwen 3.8 Flash
    model_type: text_generation
    input_modalities: [text, image]
    output_modalities: [text]
    categories: [TEXT_MODEL, VISION_MODEL]
    operations: [chat]
    features: [streaming, tool_calling, json_schema, reasoning]
    context_window: 1000000
    max_output_tokens: 131072
  - model: qwen3.7-text-embedding
    label: Qwen 3.7 Text Embedding
    model_type: embedding
    input_modalities: [text]
    output_modalities: [vector]
    categories: [VECTOR_MODEL]
    operations: [embeddings]
    context_window: 128000
  - model: qwen3.7-text-embedding-flash
    label: Qwen 3.7 Text Embedding Flash
    model_type: embedding
    input_modalities: [text]
    output_modalities: [vector]
    categories: [VECTOR_MODEL]
    operations: [embeddings]
    context_window: 128000
  - model: qwen3.7-text-rerank
    label: Qwen 3.7 Text Rerank
    model_type: rerank
    input_modalities: [text]
    output_modalities: [json]
    categories: [VECTOR_MODEL]
    operations: [rerank]
    context_window: 32768
  - model: qwen3-rerank
    label: Qwen 3 Rerank
    model_type: rerank
    input_modalities: [text]
    output_modalities: [json]
    categories: [VECTOR_MODEL]
    operations: [rerank]
    context_window: 4000
